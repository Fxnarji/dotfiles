
#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 3

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $active_border
    col.inactive_border = $inactive_border

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 0.9
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = yes
        size = 15
        passes = 2 
	ignore_opacity = true

        vibrancy = 0.1696
    }
}

# Blur behind swaync's translucent panel and popups. ignore_alpha keeps the
# fully transparent parts of the layer surface from getting blurred too.
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-control-center, ignore_alpha 0.1
layerrule = match:namespace swaync-notification-window, blur on
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.1

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
    bezier = ease, 0.25, 1.0, 0.5, 1.0
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = windows, 1, 2, ease, popin
    animation = fade, 1, 3, ease
    animation = border, 1, 1, ease
    animation = workspaces, 1, 2, ease, slide
}
